[package]
name = "collecout"
version = "0.4.0"
description = "萃序 Collecout —— 把 Word、Excel 和纯文本萃成结构化的信息库"
authors = ["MogroWang Studio"]
edition = "2021"

[lib]
name = "collecout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
