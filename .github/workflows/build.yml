name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portable:
    name: Windows x64 便携版
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: npm ci

      - name: 构建 Tauri 应用
        run: npm run tauri build

      - name: 整理便携版可执行文件
        shell: pwsh
        run: |
          $candidates = @("src-tauri/target/release/Collecout.exe", "src-tauri/target/release/collecout.exe")
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "未找到构建产物 collecout.exe" }
          Copy-Item $exe -Destination "Collecout_${{ steps.ver.outputs.version }}_x64_portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: Collecout-${{ steps.ver.outputs.version }}-windows-x64-portable
          path: Collecout_*_x64_portable.exe
          if-no-files-found: error

  macos-dmg-arm64:
    name: macOS arm64 DMG
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: npm ci

      - name: 构建 DMG
        run: npm run tauri build -- --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: Collecout-${{ steps.ver.outputs.version }}-macos-arm64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  android-apk:
    name: 安卓 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 安装依赖
        run: npm ci

      - name: 构建前端并同步到安卓工程
        run: |
          npm run build
          npx cap sync android

      - name: 解码签名证书
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/collecout.keystore
          echo "ANDROID_KEYSTORE_PATH=/tmp/collecout.keystore" >> "$GITHUB_ENV"

      - name: 构建 APK
        run: |
          chmod +x android/gradlew
          android/gradlew -p android assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Collecout-${{ steps.ver.outputs.version }}-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
